<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Garur AI Dashboard</title><style>body{font-family:system-ui;background:#0f1115;color:#eee;max-width:900px;margin:auto;padding:16px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.c{background:#1b1f27;border-radius:12px;padding:14px}.v{font-size:1.3rem;font-weight:700}.s{color:#9aa4b2}.bad{color:#ff6565}.ok{color:#6ee7a8}</style></head><body><h2>Garur / Vishnu AI Dashboard</h2><div class=g><div class=c><div class=s>State</div><div id=state class=v>—</div></div><div class=c><div class=s>Entry</div><div id=entry class=v>—</div></div><div class=c><div class=s>Exit</div><div id=exit class=v>—</div></div><div class=c><div class=s>Nano</div><div id=nano class=v>—</div></div><div class=c><div class=s>Fault</div><div id=fault class=v>—</div></div><div class=c><div class=s>AI</div><div id=ai class=v>—</div><div id=aiReason class=s style="margin-top:4px;font-size:0.8rem"></div></div></div><div class=c><h3>Events</h3><pre id=events>waiting…</pre></div><script type=module>import{initializeApp}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js';const firebaseConfig={apiKey:'CHANGE_ME',authDomain:'CHANGE_ME.firebaseapp.com',databaseURL:'https://CHANGE_ME.firebasedatabase.app',projectId:'CHANGE_ME',appId:'CHANGE_ME'};const app=initializeApp(firebaseConfig),db=getDatabase(app);onValue(ref(db,'garur/current'),s=>{const j=s.val()||{};state.textContent=j.state||'—';entry.textContent=j.entry?'ACTIVE':'clear';exit.textContent=j.exit?'ACTIVE':'clear';nano.textContent=j.nanoOk?'OK':'CHECK';fault.textContent=j.fault||'none';ai.textContent=j.aiAction||'monitor';aiReason.textContent=j.aiReason||''});onValue(ref(db,'garur/events'),s=>{events.textContent=JSON.stringify(s.val()||{},null,2)});</script></body></html>
